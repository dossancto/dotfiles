[ids]
*

[main]
# Maps Fn key to activate the 'nav' layer while held
# leftcontrol = a

# leftmeta = rightcontrol
capslock = overload(nav, escape)

[nav]
# arrows
h = left
j = down
k = up
l = right

# [Numbers] Right hand
[ = -
] = +
´ = -
[ = -
p = 0
o = 9
i = 8
u = 7
y = 6

# [Numbers] Left hand
t = 5
r = 4
e = 3
w = 2
[ = -
q = 1

# [FN] Left hand
a = f1

# [FN] Right hand
; = f12

# Layer active when holding Caps Lock + Alt simultaneously
[nav+alt]
h = backspace
l = enter
[ = \
´ = \
